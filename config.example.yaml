matrix:
  homeserver: https://matrix.example.org
  user_id: "@musicbot:example.org"
  access_token: "syt_..."
  device_id: "MUSICBOT"
  # The room the bot listens in and streams into. An encrypted room needs the
  # crypto section below.
  room_id: "!streaming:example.org"
  # Users allowed to run control commands (!stop, !clear, !skip).
  # Leave empty to let everyone control the bot.
  admins:
    - "@you:example.org"
  command_prefix: "!"

  # End-to-end encryption, for an encrypted room. Element Call encrypts the
  # call media whenever the room is encrypted, so the bot encrypts both its
  # messages and its audio there. Leave store empty for an unencrypted room;
  # the bot refuses an encrypted one without it.
  #
  # The access token must belong to a device that has never had encryption
  # keys, or that this store already holds: a device whose keys were made
  # elsewhere cannot be taken over. A fresh login for the bot is simplest.
  crypto:
    # SQLite database for the Olm account and Megolm sessions. Keep it: a bot
    # that loses it is a new device nobody has shared keys with.
    store: ""            # e.g. /data/crypto.db
    # Encrypts the secrets in the store at rest. Optional.
    pickle_key: ""
    # A file holding the account's recovery key. With it the bot cross-signs
    # its own device at startup, so clients show it as verified. Run the bot
    # once with -setup-cross-signing to make one.
    recovery_key_file: ""

rtc:
  # Optional. Leave empty to discover the MatrixRTC authorization service from
  # the homeserver's /.well-known/matrix/client (org.matrix.msc4143.rtc_foci).
  livekit_service_url: ""
  display_name: "Jukebox"

  # Which MatrixRTC dialect to speak.
  #
  #   legacy  the session-style org.matrix.msc3401.call.member state event and
  #           the /sfu/get token endpoint: what Element Call deployments use
  #           today.
  #   sticky  the MSC4143 m.rtc.member event, sent as an MSC4354 sticky event,
  #           with a token from /get_token: what replaces it.
  #   both    publish both, so clients on either side of the transition see the
  #           bot. This costs a second SFU connection — the two dialects derive
  #           different LiveKit identities and one connection can only be one of
  #           them — and so doubles the bot's upstream bandwidth. A client that
  #           reads both dialects (Element Call in Matrix 2.0 mode) shows the
  #           bot twice.
  #   auto    be ready on both, but in the call only on the dialects its
  #           clients need: sticky for clients that publish both or only
  #           sticky, legacy for clients that publish only legacy. The bot
  #           switches as clients come and go, so each sees it once.
  #
  # "sticky", "both" and "auto" fall back to legacy on a homeserver that does
  # not advertise MSC4143 and MSC4354.
  stack: "auto"

  # How long a published sticky membership stays valid without a refresh. The
  # bot refreshes well ahead of this; the value only bounds how long a crashed
  # bot lingers in the participant list. MSC4354 caps it at 1h.
  sticky_duration: 10m

  # The MatrixRTC slot to join. The default is the room-wide call every calling
  # client uses; change it only if you know you need a separate session.
  slot_id: "m.call#ROOM"

  # Pause and leave the call when the last listener goes, rejoining and picking
  # up where it left off when somebody comes back. Set to false to sit in the
  # call for as long as the bot runs, which keeps the room showing a call in
  # progress and holds an SFU connection per dialect open for nobody.
  leave_when_alone: true

  # How long an empty call is given to refill before the bot leaves it. It is
  # there for the client that drops and comes straight back — a phone locking,
  # a network handover — which would otherwise cost a full rejoin each time.
  linger: 45s

jellyfin:
  server: http://jellyfin.local:8096
  api_key: "..."
  # Jellyfin user whose library view and playlists the bot uses.
  user_id: "..."

player:
  search_limit: 10
  result_ttl: 10m
  max_queue: 200
  ffmpeg_path: ffmpeg

audio:
  # Target bitrate for the Opus encode. The bot sends this rate constantly to
  # the SFU and never adapts to congestion feedback, so it is what every
  # listener receives.
  bitrate: 128k
  # constrained = stay close to the target bitrate (what you set is what is
  #               sent)
  # on          = free-running VBR, better quality but overshoots the target
  #               by roughly 15% (128k measured at ~148 kbps)
  # off         = constant bitrate
  vbr: constrained
  # Two channels. Mono needs roughly half the bitrate for the same perceived
  # quality, which is worth considering if bandwidth matters more than imaging.
  stereo: true
  # Encode inband FEC for this packet-loss percentage. 0 disables it; 5-10
  # suits a lossy network, at the cost of some of the bitrate going to
  # redundancy rather than audio.
  fec_packet_loss: 0
  # Publish the current album cover as a still video track, so the bot shows a
  # picture in the call rather than an empty tile. Costs roughly 12KB per track
  # change plus an occasional keyframe refresh.
  album_art_video: true
  # Send now-playing announcements as the cover image with the track details as
  # the caption, rather than as plain text.
  album_art_chat: true
