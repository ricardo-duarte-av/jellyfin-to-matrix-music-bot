matrix:
  homeserver: https://matrix.example.org
  user_id: "@musicbot:example.org"
  access_token: "syt_..."
  device_id: "MUSICBOT"
  # The room the bot listens in and streams into. It MUST be unencrypted:
  # Element Call only runs the call without media E2EE in unencrypted rooms,
  # and this bot publishes plain Opus.
  room_id: "!streaming:example.org"
  # Users allowed to run control commands (!stop, !clear, !skip).
  # Leave empty to let everyone control the bot.
  admins:
    - "@you:example.org"
  command_prefix: "!"

rtc:
  # Optional. Leave empty to discover the MatrixRTC authorization service from
  # the homeserver's /.well-known/matrix/client (org.matrix.msc4143.rtc_foci).
  livekit_service_url: ""
  display_name: "Jukebox"

jellyfin:
  server: http://jellyfin.local:8096
  api_key: "..."
  # Jellyfin user whose library view and playlists the bot uses.
  user_id: "..."

player:
  search_limit: 10
  result_ttl: 10m
  max_queue: 200
  ffmpeg_path: ffmpeg

audio:
  # Target bitrate for the Opus encode. The bot sends this rate constantly to
  # the SFU and never adapts to congestion feedback, so it is what every
  # listener receives.
  bitrate: 128k
  # constrained = stay close to the target bitrate (what you set is what is
  #               sent)
  # on          = free-running VBR, better quality but overshoots the target
  #               by roughly 15% (128k measured at ~148 kbps)
  # off         = constant bitrate
  vbr: constrained
  # Two channels. Mono needs roughly half the bitrate for the same perceived
  # quality, which is worth considering if bandwidth matters more than imaging.
  stereo: true
  # Encode inband FEC for this packet-loss percentage. 0 disables it; 5-10
  # suits a lossy network, at the cost of some of the bitrate going to
  # redundancy rather than audio.
  fec_packet_loss: 0
  # Publish the current album cover as a still video track, so the bot shows a
  # picture in the call rather than an empty tile. Costs roughly 12KB per track
  # change plus an occasional keyframe refresh.
  album_art_video: true
  # Send now-playing announcements as the cover image with the track details as
  # the caption, rather than as plain text.
  album_art_chat: true
